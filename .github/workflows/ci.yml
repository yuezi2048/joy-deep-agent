name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本从 package.json 的 packageManager 读，避免两处版本打架
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 一条命令跑完单测与评测门禁；门禁失败即非零退出（见 docs/eval/metrics.md 第七节）
      - run: pnpm verify
